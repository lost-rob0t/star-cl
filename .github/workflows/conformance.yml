name: StarIntel conformance

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  common-lisp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Star-Lang authority lock
        run: |
          test "$(jq -r .canonical_repository schema/starintel-schema.lock.json)" = "nsaspy/star-lang"
          test "$(jq -r .release_version schema/starintel-schema.lock.json)" = "0.10.1"
          test "$(jq -r .canonical_key_style schema/starintel-schema.lock.json)" = "lowerCamelCase"
          jq -e '.required_dtypes | index("audio") != null' schema/starintel-schema.lock.json >/dev/null
          jq -e '.required_dtypes | index("person-identifier") != null' schema/starintel-schema.lock.json >/dev/null
          jq -e '.required_dtypes | index("geo-point") != null' schema/starintel-schema.lock.json >/dev/null

      - name: Read Star-Lang commit
        id: schema-lock
        run: echo "commit=$(jq -r .canonical_commit schema/starintel-schema.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Star-Lang authority
        uses: actions/checkout@v6
        with:
          repository: nsaspy/star-lang
          ref: ${{ steps.schema-lock.outputs.commit }}
          path: star-lang

      - name: Verify generated artifacts are exact authority copies
        shell: bash
        run: |
          set -euo pipefail
          cmp schema/starintel-0.10.1.schema.json star-lang/specs/starintel/0.10.1/generated/schema.json
          cmp schema/starintel-0.10.1.manifest.json star-lang/specs/starintel/0.10.1/generated/portable-manifest.json
          cmp schema/starintel-0.10.1.compatibility.json star-lang/specs/starintel/0.10.1/compatibility.json
          cmp schema/starintel-0.10.1.compatibility-fixtures.json star-lang/specs/starintel/0.10.1/compatibility-fixtures.json
          cmp schema/starintel-0.10.1.release-lock.json star-lang/specs/starintel/0.10.1/release-lock.json
          cmp generated/starintel.lisp star-lang/specs/starintel/0.10.1/generated/starintel.lisp
          python star-lang/tools/finalize-starintel-release.py --check

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run Common Lisp and compatibility suites
        run: |
          mkdir -p artifacts
          set -o pipefail
          nix flake check -L 2>&1 | tee artifacts/nix-check.log
          python -m unittest discover -s tests -p 'test_v09_contract.py' -v

      - name: Install standalone adapter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl curl
          curl --fail --silent --show-error --location https://beta.quicklisp.org/quicklisp.lisp --output /tmp/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path (merge-pathnames "quicklisp/" (user-homedir-pathname)))' \
            --eval '(quit)'
          sbcl --non-interactive \
            --load "$HOME/quicklisp/setup.lisp" \
            --eval '(ql:quickload (quote (:babel :com.inuoe.jzon :ironclad :cl-ppcre)) :silent t)' \
            --eval '(quit)'

      - name: Smoke-test canonical and legacy adapter inputs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"command":"version"}' | sbcl --script bin/starintel-conformance.lisp | jq -e '.ok and .spec_version == "0.10.1"'
          printf '%s\n' '{"command":"normalize","spec_version":"0.9.0","document":{"_id":"person-ci","dataset":"fixture","dtype":"person","schema_version":"0.9.0","data":{"fname":"Ada"}}}' \
            | sbcl --script bin/starintel-conformance.lisp \
            | jq -e '.ok and .document.schemaVersion == "0.10.1" and .document.fname == "Ada"'

      - name: Upload Common Lisp diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-lisp-conformance-diagnostics
          path: artifacts/
          if-no-files-found: warn
