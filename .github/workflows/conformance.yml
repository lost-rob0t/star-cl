name: StarIntel conformance

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  common-lisp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate canonical schema lock
        run: |
          test "$(jq -r .canonical_repository schema/starintel-schema.lock.json)" = "lost-rob0t/starintel-gpt-auto-dig"
          test "$(jq -r .release_version schema/starintel-schema.lock.json)" = "0.9.1"
          jq -e '.required_dtypes | index("research-node") != null' schema/starintel-schema.lock.json > /dev/null
          jq -e '.required_dtypes | index("operation") != null' schema/starintel-schema.lock.json > /dev/null

      - name: Read canonical schema lock
        id: schema-lock
        run: echo "commit=$(jq -r .canonical_commit schema/starintel-schema.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned conformance source
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-gpt-auto-dig
          ref: ${{ steps.schema-lock.outputs.commit }}
          path: conformance-source

      - name: Verify vendored artifacts are exact pinned canonical copies
        shell: bash
        run: |
          set -euo pipefail
          schema_path="$(jq -r .schema_path schema/starintel-schema.lock.json)"
          expansion_path="$(jq -r .expansion_path schema/starintel-schema.lock.json)"
          manifest_path="$(jq -r .manifest_path schema/starintel-schema.lock.json)"

          for path in "$schema_path" "$expansion_path" "$manifest_path"; do
            test -f "$path"
            test -f "conformance-source/$path"
            if ! cmp --silent "$path" "conformance-source/$path"; then
              echo "::error file=$path::vendored artifact differs from pinned canonical source"
              echo "vendored:  $(sha256sum "$path")"
              echo "canonical: $(sha256sum "conformance-source/$path")"
              exit 1
            fi
          done

          grep -q '"operation"' "$schema_path"
          jq -e '.dtype_fields.operation != null' "$expansion_path" >/dev/null
          jq -e '.dtype_count == 51' "$manifest_path" >/dev/null
          jq -e '.release_version == "0.9.1"' "$manifest_path" >/dev/null
          jq -e '.profile_version == "0.9.1"' "$manifest_path" >/dev/null
          jq -e '.schema_revision == "0.9.0+fields.20260909.1"' "$manifest_path" >/dev/null

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run existing Common Lisp suite
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source
        run: |
          mkdir -p artifacts
          set -o pipefail
          nix flake check -L 2>&1 | tee artifacts/nix-check.log

      - name: Install standalone v0.9 runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl curl
          curl --fail --silent --show-error --location https://beta.quicklisp.org/quicklisp.lisp --output /tmp/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path (merge-pathnames "quicklisp/" (user-homedir-pathname)))' \
            --eval '(quit)'
          cat >/tmp/install-starintel-v090-deps.lisp <<'LISP'
          (load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))
          (ql:quickload '(:com.inuoe.jzon :cl-ppcre) :silent t)
          (quit)
          LISP
          sbcl --script /tmp/install-starintel-v090-deps.lisp

      - name: Run Common Lisp fixture suite
        working-directory: conformance-source
        run: |
          set +e
          set -o pipefail
          python -m conformance.runner test \
            --producer cl \
            --consumer cl \
            --adapter "cl=sbcl --script $GITHUB_WORKSPACE/bin/starintel-conformance.lisp" \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/cl-matrix.log"
          status=${PIPESTATUS[0]}
          if [ -f artifacts/conformance-report.json ]; then
            cp artifacts/conformance-report.json "$GITHUB_WORKSPACE/artifacts/cl-conformance-report.json"
          fi
          exit "$status"

      - name: Upload Common Lisp diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-lisp-conformance-diagnostics
          path: artifacts/
          if-no-files-found: warn
