name: StarLang canonical contract
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 bin/sync-starintel-schema.py
      - run: python3 -m unittest discover -s tests -p test_v09_contract.py -v
      - run: git diff --check
