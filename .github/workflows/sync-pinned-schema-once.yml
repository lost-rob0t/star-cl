name: Sync pinned StarIntel schema once

on:
  push:
    branches: [fix/canonical-operation-v091-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canonical-operation-v091-sync
      - name: Fetch exact pinned canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          commit="$(jq -r .canonical_commit schema/starintel-schema.lock.json)"
          test "$commit" = "6479c0a9dc88ce9fed183515fc4df5d245de0b3a"
          base="https://raw.githubusercontent.com/lost-rob0t/starintel-gpt-auto-dig/${commit}/schemas"
          for name in \
            starintel-doc-v0.9.0.schema.json \
            starintel-doc-v0.9.0.expansion.json \
            starintel-doc-v0.9.0.manifest.json
          do
            curl --fail --silent --show-error --location "$base/$name" --output "schemas/$name"
          done
          grep -q '"operation"' schemas/starintel-doc-v0.9.0.schema.json
          jq -e '.dtype_fields.operation != null' schemas/starintel-doc-v0.9.0.expansion.json >/dev/null
          jq -e '.dtype_count == 51 and .release_version == "0.9.1"' schemas/starintel-doc-v0.9.0.manifest.json >/dev/null
      - name: Commit synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- schemas/; then
            echo "Canonical artifacts already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/
          git commit -m "fix(schema): vendor exact pinned 0.9.1 artifacts"
          git push origin HEAD:fix/canonical-operation-v091-sync
